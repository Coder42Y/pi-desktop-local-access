name: Stage 0.21.0-local.4
run-name: Stage 0.21.0-local.4 draft from verified native artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release-stage-local-4
  cancel-in-progress: false

env:
  BUILD_RUN: '42340436461'
  SOURCE_SHA: 1588e6dbfe4920a239f660635f4db8aa3e4c3d9c
  RELEASE_TAG: v0.21.0-local.4
  RELEASE_ID: '437354152'

jobs:
  stage:
    if: github.repository == 'Coder42Y/pi-desktop-local-access' && github.ref == 'refs/heads/codex/release-local-4'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify the pinned native run and publication target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > "$RUNNER_TEMP/native-run.json"
          jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .status == "completed" and .conclusion == "success" and .event == "workflow_dispatch" and .path == ".github/workflows/fork-release.yml"' "$RUNNER_TEMP/native-run.json"
          gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...main" --jq .status | grep -Ex 'ahead|identical'
          node scripts/release-staging/guard-release.mjs
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN }}
          pattern: fork-*
          path: ${{ runner.temp }}/local4-release/artifacts
      - name: Verify provenance, checksums and local update feeds
        run: |
          set -euo pipefail
          if ! /usr/bin/python3 -c 'import yaml'; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y python3-yaml
          fi
          node scripts/release-staging/verify-artifacts.mjs "$RUNNER_TEMP/local4-release"
      - name: Stage and verify the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-staging/stage-release.mjs "$RUNNER_TEMP/local4-release"
      - uses: actions/upload-artifact@v7
        with:
          name: fork-release-publication-evidence
          path: |
            ${{ runner.temp }}/local4-release/release-manifest.json
            ${{ runner.temp }}/local4-release/upload-verification.json
          if-no-files-found: error
          retention-days: 14
