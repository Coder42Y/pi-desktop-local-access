name: Release asset bridge (temporary branch)
run-name: Assemble ${{ inputs.release_tag }} release assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release whose verified chunks should be assembled
        required: true
        type: choice
        options:
          - local-v0.21.0-1
          - local-v0.21.0-0
        default: local-v0.21.0-1

permissions:
  contents: write

concurrency:
  group: release-asset-bridge-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  assemble:
    if: github.ref == 'refs/heads/chore/release-asset-transfer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Test chunk validation and reassembly
        run: python3 scripts/release-asset-bridge.test.py
      - name: Verify chunks, restore installers, upload and clean transfer inputs
        run: python3 scripts/release-asset-bridge.py --repo "$GH_REPO" --tag "$RELEASE_TAG"
      - name: Record transfer provenance
        run: |
          printf 'Verified installer transfer for `%s` using helper source `%s`. Release remains draft.\n' "$RELEASE_TAG" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
